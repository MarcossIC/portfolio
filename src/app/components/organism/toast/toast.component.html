<div
  [class]="'toast-list ' + toasts().position"
  role="region"
  aria-live="polite"
  aria-relevant="additions"
  [attr.aria-label]="UI().REGION_LABEL"
>
  @for (toast of toasts().toasts; track toast.ID) {
    @if (toast.visible) {
      <article
        [class]="'toast ' + toast.type"
        [class.leaving]="toast.leaving"
        [id]="toast.ID"
        [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
        (mouseenter)="pause(toast.ID)"
        (mouseleave)="resume(toast.ID)"
        (focusin)="pause(toast.ID)"
        (focusout)="resume(toast.ID)"
      >
        <span class="bar" aria-hidden="true"></span>

        <span class="icon" aria-hidden="true">
          @switch (toast.type) {
            @case ('info') {
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6" />
                <path d="M10 9v5M10 6.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            }
            @case ('success') {
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6" />
                <path d="m6 10.3 2.7 2.7L14 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
            @case ('warning') {
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M10 2.5 18 16.5H2L10 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <path d="M10 8v4M10 14.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            }
            @case ('error') {
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.6" />
                <path d="m7 7 6 6M13 7l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            }
          }
        </span>

        <div class="body">
          <h4 class="title">{{ toast.title }}</h4>
          <p class="message">{{ toast.message }}</p>
        </div>

        <button
          type="button"
          class="btn-close"
          [attr.aria-label]="UI().CLOSE"
          (click)="close(toast.ID)"
        >
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="m2 2 10 10M12 2 2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </article>
    }
  }
</div>
