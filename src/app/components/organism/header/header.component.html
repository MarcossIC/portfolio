<!-- Scrim: dims the page behind the open panel; tap closes. Sibling of the header (fixed inside a backdrop-filter element would be clipped to it). Pointer-only, not focusable. -->
<div class="mobile-scrim" [class.is-open]="mobileOpen()" aria-hidden="true" (click)="closeMobile()"></div>
<header
  class="header glass animate-slide-down"
  [class.is-scrolled]="scrolled()"
>
  <div class="header-container">
    <!-- Logo -->
    <button class="logo-btn" (click)="scrollToTop()" aria-label="Scroll to top">
      M
    </button>

    <!-- Center nav (desktop) -->
    <nav class="nav-desktop">
      <div class="nav-pill">
        @for (NAVIGATION of NAVIGATIONS(); track NAVIGATION.ID) {
          <navigate
            [path]="NAVIGATION.PATH"
            [fragment]="NAVIGATION.FRAGMENT"
            class="nav-link cursor-pointer"
            [class.is-active]="activeSection.active() === NAVIGATION.FRAGMENT"
            [current]="activeSection.active() === NAVIGATION.FRAGMENT"
          >{{ NAVIGATION.LABEL }}</navigate>
        }
      </div>
    </nav>

    <!-- Right options (desktop) -->
    <div class="header-right">
      <header-menu-options></header-menu-options>
    </div>

    <!-- Mobile hamburger -> X (transform only) -->
    <button
      #toggleBtn
      type="button"
      class="mobile-toggle"
      [class.is-open]="mobileOpen()"
      (click)="toggleMobile()"
      [attr.aria-label]="mobileOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="mobileOpen()"
      aria-controls="mobile-menu"
    >
      <span class="burger" aria-hidden="true">
        <span class="burger-bar burger-bar--top"></span>
        <span class="burger-bar burger-bar--mid"></span>
        <span class="burger-bar burger-bar--bot"></span>
      </span>
    </button>
  </div>

  <!-- Mobile menu: always in the DOM, animated with transform + opacity, inert while closed -->
  <nav
    #mobilePanel
    id="mobile-menu"
    class="mobile-nav"
    [class.is-open]="mobileOpen()"
    [attr.inert]="mobileOpen() ? null : ''"
    aria-label="Mobile"
  >
    @for (NAVIGATION of NAVIGATIONS(); track NAVIGATION.ID) {
      <navigate
        [path]="NAVIGATION.PATH"
        [fragment]="NAVIGATION.FRAGMENT"
        class="mobile-link"
        [class.is-active]="activeSection.active() === NAVIGATION.FRAGMENT"
        [current]="activeSection.active() === NAVIGATION.FRAGMENT"
        (click)="closeMobile('none')"
      >{{ NAVIGATION.LABEL }}</navigate>
    }
    <div class="mobile-options">
      <header-menu-options context="mobile"></header-menu-options>
      <atmosphere-toggle variant="compact" class="mobile-atmos"></atmosphere-toggle>
    </div>
  </nav>
</header>
