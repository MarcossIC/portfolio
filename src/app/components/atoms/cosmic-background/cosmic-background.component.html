<div class="cosmic-bg">
  <!-- Nebula with parallax. Pad of 40px each side so the ±10px drift never shows an edge. -->
  <div #parallaxLayer class="parallax-layer">
    <!-- Live CSS stack: exact SSR/first paint and fallback when baking is impossible.
         Removed from rendering (display:none) once both atmospheres are baked. -->
    <div class="parallax-img-container live-only">
      <img
        #nebulaImg
        src="assets/cosmic-bg.jpg"
        alt=""
        class="nebula-img"
        loading="eager"
      />
      <div class="parallax-img-overlay"></div>
    </div>

    <!-- Baked, opaque bitmaps of the whole static stack (one per atmosphere).
         Ember sits on top and only its opacity changes on a theme switch. -->
    <canvas #bakeNebula class="bake bake--nebula" aria-hidden="true"></canvas>
    <canvas #bakeEmber class="bake bake--ember" aria-hidden="true"></canvas>
  </div>

  <!-- Cool violet veil (Nebula only) — live stack only -->
  <div class="cool-veil live-only"></div>

  <!-- Dark overlay for depth — live stack only -->
  <div class="overlay-depth live-only"></div>

  <!-- Star field: opacity-only twinkles, no filter on the container -->
  <div class="star-field">
    @for (star of stars; track $index) {
      <div
        class="star animate-twinkle"
        [class.star--bright]="star.isBright"
        [class.star--extra]="star.extra"
        [style.left.%]="star.x"
        [style.top.%]="star.y"
        [style.width.px]="star.size"
        [style.height.px]="star.size"
        [style.--duration]="star.duration + 's'"
        [style.--delay]="star.delay + 's'"
      ></div>
    }
  </div>

  <!-- Star flare: pre-rastered halos; the atmosphere toggle animates only its opacity -->
  <div class="star-flare" data-star-flare aria-hidden="true">
    <div class="star-flare-layer" [style.background-image]="flareCore"></div>
    <div class="star-flare-layer star-flare-layer--extra" [style.background-image]="flareExtra"></div>
  </div>

  <!-- Orb accents -->
  <div class="orb orb--purple animate-pulse-glow"></div>
  <div class="orb orb--red animate-pulse-glow" style="animation-delay: 2s"></div>

  <!-- Scanlines -->
  <div class="scanlines"></div>

  <!-- Bottom fade -->
  <div class="bottom-fade"></div>
</div>
