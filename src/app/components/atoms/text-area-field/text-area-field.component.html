<div
  class="relative h-[214px] w-[90%] max-[1080px]:mx-auto min-[480px]:w-[450px] min-[1080px]:w-full max-w-[450px] min-[1480px]:h-[250px] min-[1480px]:max-w-[85%]"
>
  <textarea
    [name]="name()"
    [id]="id()"
    [formControl]="fieldControl"
    role="textbox"
    [attr.aria-label]="aria()"
    [attr.aria-describedby]="id() + '-feedback'"
    autocapitalize="none"
    placeholder=" "
    [cols]="cols()"
    [rows]="rows()"
  ></textarea>
  <label [for]="id()">{{ label() }}</label>
  <span class="char-counter" [class.char-warning]="charCount > 270">
    {{ charCount }}/{{ maxLength }}
  </span>
  @if (showSuccess) {
    <span [id]="id() + '-feedback'" class="success-indicator">
      <SuccessIcon />
    </span>
  }
  @if(showError){
  <error-message
    [id]="id() + '-feedback'"
    errorClass="text-[#e12a2a] items-center font-semibold text-center"
    [errorMessage]="errorMessage()"
  ></error-message>
  }
</div>
