<div class="project-img relative">
  <div class="project-shot z-20" #projectImg>
    <!-- Container for atropos -->
    <div class="atropos project-atropos-content" useAtropos>
      <div class="atropos-scale">
        <div class="atropos-rotate">
          <div class="atropos-inner">
            <img
              class="img-container"
              [src]="SRC()"
              [alt]="TITLE()"
              width="400"
              height="400"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tech stack row (in flow, under the screenshot) -->
  <div class="project-tags">
    <ng-content></ng-content>
  </div>
</div>
