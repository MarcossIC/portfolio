<div class="project-img relative">
  <a
    [attr.href]="REPO() || null"
    [attr.target]="REPO() ? '_blank' : null"
    [title]="TITLE()"
    [class.cursor-pointer]="!!REPO()"
    class="link-to-repo z-20 outline-none focus:outline-none"
    #projectImg
  >
    <!-- Container for atropos -->
    <div class="atropos project-atropos-content" useAtropos>
      <div class="atropos-scale">
        <div class="atropos-rotate">
          <div class="atropos-inner">
            <img
              class="img-container"
              [src]="SRC()"
              [alt]="TITLE()"
              width="400"
              height="250"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
      </div>
    </div>
  </a>

  <!-- Tech stack row (in flow, under the screenshot) -->
  <div class="project-tags">
    <ng-content></ng-content>
  </div>
</div>
