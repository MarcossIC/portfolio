<section
  id="hero"
  [style.transform]="'scale(' + heroScale() + ')'"
  [style.opacity]="heroOpacity()"
  style="will-change: transform, opacity;"
>
  <div class="flex flex-col text-center justify-center items-center max-w-[100cqw]">
    <h1 class="bg-ml-text-red title-base">{{ USER().fullName }}</h1>
    <h2 class="bg-ml-text-white title-base">{{ USER().role }}</h2>

    <p class="mt-2 font-manrope font-medium">
      {{ USER().motto }}
    </p>

    <div class="hero-cta-group">
      <button class="hero-cta hero-cta--primary" (click)="scrollToContact()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        {{ USER().heroCTA.talk }}
      </button>
      <a class="hero-cta hero-cta--secondary" [href]="USER().downloadCv" target="_blank" rel="noopener noreferrer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        {{ USER().heroCTA.downloadCV }}
      </a>
    </div>

    <div class="mt-5 flex flex-col relative">
      <hero-social-bar />
      <arrow-down></arrow-down>
    </div>
  </div>
</section>
