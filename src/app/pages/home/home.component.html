<hero-layout />
<experiency-layout />
<about-me-layout />

<!-- Projects section - defer until idle, prefetch immediately -->
<div id="projects" class="no-outline ring-0">
  @defer (on idle; prefetch on immediate) {
    <projects-layout />
  } @placeholder {
    <project-skeleton />
  }
</div>

<!-- Contact section - defer until idle, prefetch immediately -->
<div class="no-outline ring-0">
  @defer (on idle; prefetch on immediate) {
    <contact-layout />
  } @placeholder {
    <!-- Carries the id only until <contact-layout> (whose section owns #contact) replaces it -->
    <contact-skeleton id="contact" />
  }
</div>
